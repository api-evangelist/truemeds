aid: truemeds
name: Truemeds
description: 'Truemeds is an India-based online pharmacy and digital healthcare platform
  operated by Intellihealth Solutions that lets consumers order branded and generic
  prescription and over-the-counter medicines for home delivery across India, typically
  positioned around savings on genuine medicines, free teleconsultation with doctors,
  and substitute-medicine recommendations. It runs a consumer web and mobile app experience
  (order medicines, upload prescriptions, health blog, help center) rather than a public
  developer API program; no public API documentation, developer portal, OpenAPI, or
  partner API surface was found during enrichment. Backed by Accel and other investors,
  it was added to the API Evangelist network as a company profile.'
